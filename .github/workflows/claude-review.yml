name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    # Only run on PRs or when @claude is mentioned in a comment
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4-6   # or claude-opus-4-6 for deeper review
          direct_prompt: |
            Review this PR for the kinto-qa-system project:

            1. **Bugs & Logic Errors** — flag anything that could break functionality
            2. **Security Vulnerabilities** — check for injection, auth issues, exposed secrets
            3. **Code Quality** — readability, naming, duplication, dead code
            4. **Performance** — inefficient queries, loops, memory issues
            5. **Test Coverage** — are new features or fixes covered by tests?

            Be concise. Only flag real issues. 
            End with ✅ if approved or ⚠️ if issues were found.
