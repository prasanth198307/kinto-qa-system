name: Claude Code Review

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'client/src/**'
      - 'server/**'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Get changed files only
        id: changed
        run: |
          git fetch origin main --depth=1
          if git merge-base origin/main HEAD > /dev/null 2>&1; then
            git diff --name-only origin/main...HEAD > /tmp/changed_files.txt
          else
            echo "" > /tmp/changed_files.txt
          fi
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Check diff size
        id: diffcheck
        run: |
          LINES=$(git diff --stat origin/main...HEAD 2>/dev/null | tail -1 | awk '{print $4}')
          LINES=${LINES:-0}
          echo "lines=$LINES" >> $GITHUB_OUTPUT
          echo "Changed lines: $LINES"

      - name: Set model based on trigger
        id: model
        run: |
          if [[ "${{ github.event.comment.body }}" == *"@claude-deep"* ]]; then
            echo "model=claude-sonnet-4-6" >> $GITHUB_OUTPUT
            echo "max_turns=3" >> $GITHUB_OUTPUT
            echo "Using Sonnet deep review with 3 turns"
          else
            echo "model=claude-haiku-4-5" >> $GITHUB_OUTPUT
            echo "max_turns=5" >> $GITHUB_OUTPUT
            echo "Using Haiku standard review with 5 turns"
          fi

      - name: Run Claude Code Review
        if: |
          steps.diffcheck.outputs.lines > 10 ||
          github.event_name == 'issues' ||
          github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: ${{ steps.model.outputs.model }}
          max_turns: ${{ steps.model.outputs.max_turns }}
          direct_prompt: |
            You are reviewing the kinto-qa-system project.
            Read CLAUDE.md first for project structure and rules.

            IMPORTANT — Read ONLY these changed files:
            $(cat /tmp/changed_files.txt)

            Do NOT read or explore files outside this list.
            Do NOT scan the full codebase.
            Focus ONLY on changed lines and their direct imports.

            If triggered by an issue, build or plan the code described.
            If triggered by a PR, review the changes.
            If triggered by a comment, respond to the specific request.

            Check for:
            1. Bugs and Logic Errors — anything that could break functionality
            2. Security — injection, auth issues, exposed secrets
            3. Code Quality — readability, duplication, dead code
            4. Performance — inefficient queries, loops, memory issues
            5. Tests — are new changes covered?

            Be concise. Only flag real issues.
            End with APPROVED if approved or ISSUES FOUND if issues were found.
            At the top mention: model used + number of files reviewed.
