<html lang="en">
<head>

<title>SwachERP Feature Audit — Phases 1–26</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root {
  --surface-0: #f5f5f3;
  --surface-1: #f0efec;
  --surface-2: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --border: rgba(11,11,11,0.10);
  --border-strong: rgba(11,11,11,0.18);
  --bg-accent: #E6F1FB;
  --text-accent: #185FA5;
  --bg-warning: #FAEEDA;
  --text-warning: #854F0B;
  --radius: 8px;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-0: #1a1a19;
    --surface-1: #222220;
    --surface-2: #2c2c2a;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --bg-accent: #0C447C;
    --text-accent: #85B7EB;
    --bg-warning: #633806;
    --text-warning: #FAC775;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--surface-0);
  color: var(--text-primary);
  padding: 2rem 1rem;
  min-height: 100vh;
}
.page {
  max-width: 860px;
  margin: 0 auto;
}
h1 {
  font-size: 22px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 1.25rem;
  font-size: 12px;
  color: var(--text-secondary);
}
.legend span { display: flex; align-items: center; gap: 5px; }
.ldot { width: 12px; height: 8px; border-radius: 2px; }
.erp {
  margin-bottom: 1rem;
  border: 0.5px solid var(--border-strong);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface-2);
}
.erp-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: .7rem 1rem;
  background: var(--surface-1);
  cursor: pointer;
  user-select: none;
}
.erp-head:hover { background: var(--surface-0); }
.erp-icon { font-size: 18px; }
.erp-title { font-size: 14px; font-weight: 500; color: var(--text-primary); flex: 1; }
.erp-pct {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.chevron { font-size: 14px; color: var(--text-muted); transition: transform .2s; }
.erp-head.open .chevron { transform: rotate(180deg); }
.bar { height: 4px; background: var(--surface-0); }
.bar-fill { height: 100%; }
.features { display: none; }
.features.open { display: block; }
.col-hdr {
  display: grid;
  grid-template-columns: 20px 1fr 80px 80px;
  gap: 8px;
  padding: .3rem 1rem;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  background: var(--surface-0);
}
.feat {
  display: grid;
  grid-template-columns: 20px 1fr 80px 80px;
  gap: 8px;
  align-items: start;
  padding: .4rem 1rem;
  border-bottom: 0.5px solid var(--border);
  font-size: 12px;
}
.feat:last-child { border-bottom: none; }
.feat-name { color: var(--text-primary); line-height: 1.4; }
.feat-sub { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  text-align: center;
  white-space: nowrap;
  line-height: 1.5;
  display: inline-block;
}
.b-real { background: #EAF3DE; color: #3B6D11; }
.b-sim  { background: #FAEEDA; color: #854F0B; }
.b-ui   { background: #E6F1FB; color: #185FA5; }
.b-none { background: #FCEBEB; color: #A32D2D; }
.ico-done { color: #3B6D11; font-weight: 600; }
.ico-part { color: #854F0B; font-weight: 600; }
.ico-no   { color: #A32D2D; font-weight: 600; }
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 1.5rem;
}
.stat {
  background: var(--surface-2);
  border: 0.5px solid var(--border-strong);
  border-radius: var(--radius);
  padding: .75rem 1rem;
}
.stat-val { font-size: 24px; font-weight: 500; color: var(--text-primary); }
.stat-lbl { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.toggle-all {
  font-size: 12px;
  color: var(--text-accent);
  cursor: pointer;
  border: 0.5px solid var(--border-strong);
  background: var(--surface-2);
  padding: 4px 10px;
  border-radius: var(--radius);
  margin-bottom: 1rem;
}
.toggle-all:hover { background: var(--surface-1); }
footer {
  margin-top: 2rem;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}
@media print {
  .features { display: block !important; }
  .erp-head { cursor: default; }
  .toggle-all { display: none; }
}
</style>
</head>

let allOpen = false;

function toggleAll() {
  allOpen = !allOpen;
  document.querySelectorAll('.features').forEach(f => f.classList.toggle('open', allOpen));
  document.querySelectorAll('.erp-head').forEach(h => h.classList.toggle('open', allOpen));
  document.querySelector('.toggle-all').textContent = allOpen ? 'Collapse all' : 'Expand all';
}

const container = document.getElementById('erps');
let totalReal = 0, totalSim = 0, totalNone = 0, totalFeatures = 0;

data.forEach(erp => {
  const done = erp.features.filter(f => f.be === 'real' && f.fe === 'real').length;
  const partial = erp.features.filter(f => (f.be === 'sim' || f.fe === 'ui') && !(f.be === 'none' && f.fe === 'none')).length;
  const none = erp.features.filter(f => f.be === 'none' && f.fe === 'none').length;
  totalReal += done;
  totalSim += partial;
  totalNone += none;
  totalFeatures += erp.features.length;

  const headBg = erp.pct >= 80 ? '#EAF3DE' : erp.pct >= 60 ? '#FAEEDA' : '#FCEBEB';
  const pctColor = erp.pct >= 80 ? '#3B6D11' : erp.pct >= 60 ? '#854F0B' : '#A32D2D';

  const div = document.createElement('div');
  div.className = 'erp';
  div.innerHTML = `
    <div class="erp-head" onclick="toggleErp(this)">
      <span class="erp-icon">${erp.icon}</span>
      <span class="erp-title">${erp.name}</span>
      <span class="erp-pct" style="background:${headBg};color:${pctColor}">${erp.pct}% &nbsp;·&nbsp; ${done}/${erp.features.length} features fully real</span>
      <i class="ti ti-chevron-down chevron"></i>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${erp.pct}%;background:${erp.color}"></div></div>
    <div class="features">
      <div class="col-hdr">
        <span></span>
        <span>Feature / capability</span>
        <span style="text-align:center">Backend</span>
        <span style="text-align:center">Frontend</span>
      </div>
      ${erp.features.map(f => {
        const ico = (f.be === 'real' && f.fe === 'real') ? '<span class="ico-done">✓</span>' :
                    (f.be === 'none' && f.fe === 'none') ? '<span class="ico-no">✗</span>' :
                    '<span class="ico-part">~</span>';
        const feBadge = f.fe === 'real' ? 'Real UI' : f.fe === 'none' ? 'Not built' : f.fe === 'ui' ? 'UI only' : 'Partial';
        const feClass = f.fe === 'real' ? 'b-real' : f.fe === 'none' ? 'b-none' : f.fe === 'ui' ? 'b-ui' : 'b-sim';
        return `<div class="feat">
          ${ico}
          <div>
            <div class="feat-name">${f.name}</div>
            <div class="feat-sub">${f.sub}</div>
          </div>
          <div style="text-align:center"><span class="badge ${badgeClass[f.be]}">${badgeLabel[f.be]}</span></div>
          <div style="text-align:center"><span class="badge ${feClass}">${feBadge}</span></div>
        </div>`;
      }).join('')}
    </div>
  `;
  container.appendChild(div);
});

function toggleErp(head) {
  head.classList.toggle('open');
  head.nextElementSibling.nextElementSibling.classList.toggle('open');
}

const summary = document.getElementById('summary');
summary.innerHTML = `
  <div class="stat"><div class="stat-val" style="color:#3B6D11">${totalReal}</div><div class="stat-lbl">Features fully real (backend + frontend)</div></div>
  <div class="stat"><div class="stat-val" style="color:#854F0B">${totalSim}</div><div class="stat-lbl">Features simulated or UI-only</div></div>
  <div class="stat"><div class="stat-val" style="color:#A32D2D">${totalNone}</div><div class="stat-lbl">Features not yet built</div></div>
  <div class="stat"><div class="stat-val">${totalFeatures}</div><div class="stat-lbl">Total features audited across all ERPs</div></div>
`;
</script>
</body>
</html>
